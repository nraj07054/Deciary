name: Run app on emulator

# Installs the app on an Android emulator, walks through it with
# app/src/androidTest/.../WalkthroughTest.kt and saves a screenshot of each screen.
on:
  workflow_dispatch:
  push:
    paths:
      - "app/src/androidTest/**"
      - ".github/workflows/run-app.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest || echo "WALKTHROUGH FAILED" > walkthrough-failed.txt
            mkdir -p shots && adb pull /sdcard/Download/deciary-shots/. shots/ || true
            adb logcat -d > shots/logcat.txt || true

      - name: Collect test report
        if: always()
        run: |
          mkdir -p shots
          cp -r app/build/reports/androidTests shots/report 2>/dev/null || true
          cp walkthrough-failed.txt shots/ 2>/dev/null || true
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-run-screenshots
          path: shots

      - name: Publish screenshots to the app-run-screenshots branch
        if: always()
        run: |
          cd shots
          git init -q -b app-run-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from run ${{ github.run_id }} of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-run-screenshots

      - name: Fail if the walkthrough failed
        run: test ! -f walkthrough-failed.txt
