<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Then and now</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,450,0,0&amp;icon_names=add,arrow_back,arrow_forward,call,check,chevron_right,close,edit,error,fingerprint,lock,notifications_off,search,tune,visibility&amp;display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500;1,9..144,600&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D1A33}a:hover{color:#5E587A}
.msr{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 450,'GRAD' 0,'opsz' 24;flex:none}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F5F2FB; font-family: 'Noto Sans', sans-serif; color: #1D1A33;">

  <div style="display: flex; align-items: center; padding: 8px 8px 0 4px; height: 56px;">
    <a href="V2Letter.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #1D1A33;"><span class="msr" aria-hidden="true" style="font-size: 24px;">arrow_back</span></a>
  </div>
  <h1 style="margin: 0; padding: 4px 20px 18px; font-family: 'Fraunces', serif; font-weight: 800; font-size: 36px; line-height: 1.02;">Then <span style="font-style: italic; font-weight: 500; color: #5A3DD0;">&amp; now</span></h1>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 14px;">
    <section style="padding: 18px; border-radius: 24px; background: #EDE7FD; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <h2 style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #4A3A8C;">Then · 23 Jul</h2>
        <span style="padding: 4px 10px; border-radius: 10px; background: #FFFFFF; font-size: 12px; font-weight: 700;">70% sure</span>
      </div>
      <p style="margin: 0; font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 18px; line-height: 1.4;">Fewer than two repairs in three months, and I'll save about ₹2 lakh.</p>
    </section>

    <section style="padding: 20px 18px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 12px 24px -18px rgba(29,26,51,0.45); display: flex; flex-direction: column; gap: 22px;">
      <h2 style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #5E587A;">Now · 23 Oct</h2>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="happened" style="font-size: 16px; font-weight: 700;">What happened?</label>
        <textarea id="happened" rows="3" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 16px; border: 0; box-shadow: inset 0 0 0 1.5px #E4DEF2; background: #F5F2FB; font-family: 'Noto Sans', sans-serif; font-size: 15px; line-height: 1.45; color: #1D1A33; resize: none;">One repair, the clutch, ₹18,000. Still saved about ₹1.8 lakh.</textarea>
      </div>

      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <fieldset style="border: 0; margin: 0; padding: 0;">
          <legend style="padding: 0; margin-bottom: 10px; font-size: 16px; font-weight: 700;">{{g.q}}</legend>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #EEEAF7;">
            <sc-for list="{{g.opts}}" as="o" hint-placeholder-count="3">
              <button aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="height: 44px; border: 0; border-radius: 12px; background: {{o.bg}}; color: {{o.ink}}; box-shadow: {{o.shadow}}; font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;">{{o.label}}</button>
            </sc-for>
          </div>
        </fieldset>
      </sc-for>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="lesson" style="font-size: 16px; font-weight: 700;">One line for next time <span style="font-size: 13px; font-weight: 500; color: #5E587A;">· optional</span></label>
        <input id="lesson" placeholder="e.g. get it checked by my own mechanic" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 16px; border: 0; box-shadow: inset 0 0 0 1.5px #E4DEF2; background: #F5F2FB; font-family: 'Noto Sans', sans-serif; font-size: 15px; color: #1D1A33;">
      </div>
    </section>
  </div>

  <div style="flex: 1;"></div>
  <div style="padding: 0 16px 24px;">
    <a href="V2Verdict.dc.html" style="height: 56px; border-radius: 28px; background: #6E4FE6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 700; box-shadow: 0 12px 22px -10px rgba(78,52,190,0.6);">See verdict</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picks: [0, 1, 0] }; }
  renderVals() {
    var self = this;
    var qs = [
      ['Compared to what you expected', ['Better', 'Same', 'Worse']],
      ['Did your prediction come true?', ['Yes', 'Partly', 'No']],
      ['Would you choose the same again?', ['Yes', 'Not sure', 'No']]
    ];
    return {
      groups: qs.map(function (q, gi) {
        return {
          q: q[0],
          opts: q[1].map(function (label, oi) {
            var on = self.state.picks[gi] === oi;
            return {
              label: label, pressed: on ? 'true' : 'false',
              bg: on ? '#FFFFFF' : 'transparent', ink: on ? '#1D1A33' : '#5E587A',
              shadow: on ? '0 2px 6px rgba(29,26,51,0.15)' : 'none',
              pick: function () { var p = self.state.picks.slice(); p[gi] = oi; self.setState({ picks: p }); }
            };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
