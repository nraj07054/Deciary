<body>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500;1,9..144,600&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D1A33}a:hover{color:#5E587A}
.msr{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 450,'GRAD' 0,'opsz' 24;flex:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 10px 16px 24px; background: #F5F2FB; font-family: 'Noto Sans', sans-serif; color: #1D1A33;">

  <div style="display: flex; align-items: center; gap: 12px; height: 48px;">
    <svg role="img" aria-label="Deciary" width="30" height="30" viewBox="0 0 120 120" style="flex: none;"><defs><linearGradient id="ty8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#F0EBFF"></stop></linearGradient><linearGradient id="gy8" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#6A4CF0"></stop><stop offset="0.45" stop-color="#B24FE0"></stop><stop offset="0.8" stop-color="#F0609A"></stop><stop offset="1" stop-color="#FF9A6B"></stop></linearGradient><radialGradient id="hy8" cx="0.3" cy="0.22" r="0.6"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></radialGradient><linearGradient id="by8" x1="0" y1="0" x2="0" y2="1"><stop offset="0.6" stop-color="#2A0E5E" stop-opacity="0"></stop><stop offset="1" stop-color="#2A0E5E" stop-opacity="0.22"></stop></linearGradient><radialGradient id="sy8" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.6" stop-color="#F3EEFF"></stop><stop offset="1" stop-color="#D6CCF7"></stop></radialGradient><filter id="fy8" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="5.5" flood-color="#6A2BB8" flood-opacity="0.35"></feDropShadow></filter><filter id="vy8" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#3B1080" flood-opacity="0.35"></feDropShadow></filter></defs><rect width="120" height="120" rx="28" fill="url(#ty8)"></rect><rect x="0.75" y="0.75" width="118.5" height="118.5" rx="27.5" fill="none" stroke="#E7E1F6" stroke-width="1.5"></rect><g filter="url(#fy8)"><path d="M35 20 H58 A40 40 0 0 1 58 100 H35 Q24 100 24 89 V31 Q24 20 35 20Z" fill="url(#gy8)"></path></g><path d="M35 20 H58 A40 40 0 0 1 58 100 H35 Q24 100 24 89 V31 Q24 20 35 20Z" fill="url(#by8)"></path><path d="M35 20 H58 A40 40 0 0 1 58 100 H35 Q24 100 24 89 V31 Q24 20 35 20Z" fill="url(#hy8)"></path><g filter="url(#vy8)"><path d="M31 40 L58 62 L85 40" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="58" cy="62" r="8.5" fill="url(#sy8)"></circle></g></svg>
    <div aria-label="Slide {{pos}} of 3" style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="3">
        <button aria-label="{{b.label}}" onClick="{{b.go}}" style="height: 44px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; cursor: pointer;"><span style="width: 100%; height: 5px; border-radius: 3px; background: {{b.bg}};"></span></button>
      </sc-for>
    </div>
    <a href="V2Cover.dc.html" style="min-height: 44px; padding: 0 6px; display: flex; align-items: center; font-size: 14px; font-weight: 700; color: #1D1A33;">Skip</a>
  </div>

  <div style="position: relative; height: 392px; margin-top: 6px; border-radius: 36px; background: {{stage}}; overflow: hidden;">
    <sc-if value="{{s0}}" hint-placeholder-val="{{ true }}">
      <div role="img" aria-label="A sealed letter on its way to future you" style="position: absolute; inset: 0;">
        <div aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; margin: -170px 0 0 -150px; border-radius: 150px; border: 1.5px dashed #B9A6F5;"></div>
        <img src="../img/love-letter.png" alt="" width="190" height="190" style="position: absolute; left: 92px; top: 92px; width: 190px; height: 190px; transform: rotate(-8deg); filter: drop-shadow(0 22px 22px rgba(78,52,190,0.28));">
        <img src="../img/waving-hand.png" alt="" width="84" height="84" style="position: absolute; left: 30px; top: 40px; width: 84px; height: 84px; transform: rotate(-12deg);">
        <img src="../img/sparkles.png" alt="" width="56" height="56" style="position: absolute; right: 40px; top: 52px; width: 56px; height: 56px;">
        <div style="position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%) rotate(-2deg); display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 10px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 14px 24px -14px rgba(29,26,51,0.45); white-space: nowrap;">
          <span style="width: 32px; height: 32px; border-radius: 16px; background: #C9B8FA; box-shadow: inset 0 0 0 3px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-weight: 800; font-size: 14px;">P</span>
          <span style="display: flex; flex-direction: column;"><span style="font-size: 13px; font-weight: 700;">Sealed · Opens 23 Apr</span><span style="font-size: 11px; color: #5E587A;">Reminder on · 9:00</span></span>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{s1}}" hint-placeholder-val="{{ false }}">
      <div role="img" aria-label="A shield: your letters stay on this phone" style="position: absolute; inset: 0;">
        <div aria-hidden="true" style="position: absolute; left: 50%; top: 46%; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 150px; background: radial-gradient(closest-side, rgba(164,139,255,0.45), rgba(164,139,255,0));"></div>
        <img src="../img/shield.png" alt="" width="180" height="180" style="position: absolute; left: 105px; top: 86px; width: 180px; height: 180px; filter: drop-shadow(0 22px 24px rgba(0,0,0,0.5));">
        <span style="position: absolute; left: 22px; top: 54px; padding: 8px 14px; border-radius: 16px; background: rgba(245,242,251,0.12); box-shadow: inset 0 0 0 1px rgba(245,242,251,0.22); color: #F5F2FB; font-size: 13px; font-weight: 700; transform: rotate(-6deg);">No account</span>
        <span style="position: absolute; right: 22px; top: 92px; padding: 8px 14px; border-radius: 16px; background: rgba(245,242,251,0.12); box-shadow: inset 0 0 0 1px rgba(245,242,251,0.22); color: #F5F2FB; font-size: 13px; font-weight: 700; transform: rotate(5deg);">No cloud</span>
        <span style="position: absolute; left: 34px; top: 236px; padding: 8px 14px; border-radius: 16px; background: rgba(245,242,251,0.12); box-shadow: inset 0 0 0 1px rgba(245,242,251,0.22); color: #F5F2FB; font-size: 13px; font-weight: 700; transform: rotate(4deg);">No ads</span>
        <div style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 20px; background: #F5F2FB; white-space: nowrap;">
          <span style="width: 8px; height: 8px; border-radius: 4px; background: #2F9C95;"></span>
          <span style="font-family: 'Fraunces', serif; font-weight: 800; font-size: 16px;">0 bytes</span><span style="font-size: 13px; color: #5E587A;">ever sent</span>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
      <div role="img" aria-label="A padlock and key: lock your diary" style="position: absolute; inset: 0;">
        <img src="../img/notebook-with-decorative-cover.png" alt="" width="150" height="150" style="position: absolute; left: 46px; top: 96px; width: 150px; height: 150px; transform: rotate(-14deg);">
        <img src="../img/locked-with-key.png" alt="" width="170" height="170" style="position: absolute; right: 36px; top: 74px; width: 170px; height: 170px; filter: drop-shadow(0 22px 22px rgba(194,60,114,0.3));">
        <img src="../img/sparkles.png" alt="" width="50" height="50" style="position: absolute; left: 40px; top: 46px; width: 50px; height: 50px;">
        <div style="position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%) rotate(2deg); display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 14px 24px -14px rgba(29,26,51,0.45); white-space: nowrap;">
          <span aria-hidden="true" style="display: flex; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 5px; background: #1D1A33;"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1D1A33;"></span><span style="width: 10px; height: 10px; border-radius: 5px; background: #1D1A33;"></span><span style="width: 10px; height: 10px; border-radius: 5px; box-shadow: inset 0 0 0 2px #1D1A33;"></span></span>
          <span style="font-size: 13px; font-weight: 700;">PIN or fingerprint</span>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 22px 6px 0;">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #5A3DD0;">{{kicker}}</span>
    <h1 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 800; font-size: 36px; line-height: 1.02; letter-spacing: -0.01em;">{{titleA}} <span style="font-style: italic; font-weight: 500; color: #5A3DD0;">{{titleB}}</span></h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #5E587A;">{{body}}</p>
  </div>

  <div style="flex: 1;"></div>

  <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
    <button onClick="{{next}}" style="height: 56px; border: 0; border-radius: 28px; background: #6E4FE6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Noto Sans', sans-serif; font-size: 16px; font-weight: 700; box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 12px 22px -10px rgba(78,52,190,0.6); cursor: pointer;">Continue<span class="msr" aria-hidden="true" style="font-size: 18px;">arrow_forward</span></button>
  </sc-if>
  <sc-if value="{{last}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; gap: 8px;">
        <a href="V2Cover.dc.html" style="flex: 1; height: 56px; border-radius: 28px; background: #6E4FE6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 700; box-shadow: 0 12px 22px -10px rgba(78,52,190,0.6);">Set a PIN</a>
        <a href="V2Cover.dc.html" style="flex: 1; height: 56px; border-radius: 28px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #1D1A33; color: #1D1A33; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-size: 15px; font-weight: 700;"><span class="msr" aria-hidden="true" style="font-size: 18px;">fingerprint</span>Fingerprint</a>
      </div>
      <a href="V2Cover.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1D1A33;">Not now</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    var self = this, i = this.state.i;
    var s = [
      { k: 'Welcome to Deciary', a: 'Letters to', b: 'future you', body: 'Write down a decision and what you expect. Seal it. Open it later and see how it really went.', stage: '#EDE7FD' },
      { k: 'Offline by design', a: 'It never leaves', b: 'your phone', body: 'Every letter is stored only in this app, on this phone. Nothing is sent anywhere, ever.', stage: '#1D1A33' },
      { k: 'Optional', a: 'Lock it,', b: 'if you like', body: 'Add a PIN or fingerprint now, or skip and turn it on later in Settings.', stage: '#FCE4EE' }
    ][i];
    return {
      pos: i + 1, s0: i === 0, s1: i === 1, s2: i === 2, last: i === 2, notLast: i !== 2,
      stage: s.stage, kicker: s.k, titleA: s.a, titleB: s.b, body: s.body,
      next: function () { self.setState({ i: Math.min(2, i + 1) }); },
      bars: [0, 1, 2].map(function (n) {
        return { label: 'Go to slide ' + (n + 1), bg: n <= i ? '#1D1A33' : '#DCD3F5', go: function () { self.setState({ i: n }); } };
      })
    };
  }
}
</script>
</body>
</html>
