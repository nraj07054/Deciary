<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 0, name: 'Priya' }; }
  renderVals() {
    var self = this;
    var keys = ['Ink', 'Plum', 'Tan'];
    var pal = {"Ink": {"base": "#2A2547", "dark": "#120F24", "light": "#433C6E", "thread": "#C9B8FA", "ink": "#EEEAF8", "hi": "#4D4680", "lo": "#07050F", "m0": "#FFE1D6", "m1": "#E0A08C", "m2": "#9A5A4A"}, "Plum": {"base": "#5B3FB0", "dark": "#2E1C6B", "light": "#7A5ED6", "thread": "#D9CCFF", "ink": "#F3EEFF", "hi": "#8F7AE0", "lo": "#24145A", "m0": "#FFFFFF", "m1": "#C9C4D6", "m2": "#7C7690"}, "Tan": {"base": "#A8693A", "dark": "#5E3517", "light": "#C98B55", "thread": "#F4E1C1", "ink": "#FFF6EA", "hi": "#D29A6A", "lo": "#4A2711", "m0": "#FFF1C2", "m1": "#D4A44A", "m2": "#8C6420"}};
    var name = (this.state.name || '').trim();
    var out = {
      lc: pal[keys[this.state.pick]],
      name: this.state.name,
      owner: name || 'My diary',
      onName: function (e) { self.setState({ name: e.target.value }); }
    };
    keys.forEach(function (k, i) {
      var on = i === self.state.pick;
      out['sw' + i] = { pressed: on ? 'true' : 'false', ring: on ? 'inset 0 0 0 2.5px #1D1A33' : 'inset 0 0 0 1px #E4DEF2', pick: function () { self.setState({ pick: i }); } };
    });
    return out;
  }
}
</script>
