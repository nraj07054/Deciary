<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your shelf v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,450,0,0&amp;icon_names=add,arrow_back,arrow_forward,call,check,chevron_right,close,edit,error,fingerprint,lock,notifications_off,search,tune,visibility&amp;display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500;1,9..144,600&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D1A33}a:hover{color:#5E587A}
.msr{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 450,'GRAD' 0,'opsz' 24;flex:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F5F2FB; font-family: 'Noto Sans', sans-serif; color: #1D1A33;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 0 4px; height: 56px;">
    <a href="V2Home.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #1D1A33;"><span class="msr" aria-hidden="true" style="font-size: 24px;">arrow_back</span></a>
    <button aria-label="Search letters" style="width: 44px; height: 44px; border: 0; padding: 0; border-radius: 22px; background: #FFFFFF; color: #1D1A33; box-shadow: 0 6px 14px -6px rgba(29,26,51,0.3); display: flex; align-items: center; justify-content: center;"><span class="msr" aria-hidden="true" style="font-size: 20px;">search</span></button>
  </div>

  <div style="padding: 4px 20px 0; display: flex; align-items: center; gap: 12px;">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
      <h1 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 800; font-size: 36px; line-height: 1.02;">Your <span style="font-style: italic; font-weight: 500; color: #5A3DD0;">shelf</span></h1>
      <span style="font-size: 14px; color: #5E587A;">7 letters since July</span>
    </div>
    <img src="../img/open-mailbox-with-raised-flag.png" alt="" aria-hidden="true" width="72" height="72" style="width: 72px; height: 72px; transform: rotate(6deg);">
  </div>

  <div role="group" aria-label="Show" style="margin: 18px 16px 0; padding: 4px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 0 0 1px #E4DEF2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="height: 44px; border: 0; border-radius: 16px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">{{t.label}}<span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: {{t.countBg}}; font-size: 11px; display: flex; align-items: center; justify-content: center;">{{t.count}}</span></button>
    </sc-for>
  </div>

  <div style="padding: 6px 16px 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <sc-if value="{{r.header}}" hint-placeholder-val="{{ false }}">
        <h2 style="margin: 14px 4px 2px; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #5E587A;">{{r.month}}</h2>
      </sc-if>
      <a href="V2Letter.dc.html" style="min-height: 76px; box-sizing: border-box; padding: 12px 12px 12px 12px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 10px 20px -16px rgba(29,26,51,0.45); display: flex; align-items: center; gap: 14px; text-decoration: none; color: #1D1A33;">
        <span aria-hidden="true" style="flex: none; width: 52px; height: 52px; border-radius: 16px; background: {{r.tile}}; display: flex; align-items: center; justify-content: center;"><img src="{{r.art}}" alt="" width="38" height="38" style="width: 38px; height: 38px;"></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
          <span style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{r.title}}</span>
          <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5E587A;">
            <span style="display: inline-flex; align-items: center; gap: 5px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{r.moodColor}};"></span>{{r.mood}}</span>
            <span>{{r.meta}}</span>
          </span>
        </span>
        <span style="flex: none; padding: 5px 10px; border-radius: 12px; background: {{r.pillBg}}; color: {{r.pillInk}}; font-size: 11px; font-weight: 800; letter-spacing: 0.02em;">{{r.pill}}</span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0 }; }
  renderVals() {
    var self = this;
    var all = [
      { m: 'October', title: 'Buy a second-hand car instead of a new one', mood: 'Calm', moodColor: '#2F9C95', meta: 'Opened 23 Oct', verdict: 'Earned it', art: 'img/1st-place-medal.png', status: 'Opened' },
      { m: 'October', title: 'Accept the Pune job offer?', mood: 'Excited', moodColor: '#D9578C', meta: 'Opens 23 Apr', verdict: '', art: 'img/envelope.png', status: 'Sealed' },
      { m: 'October', title: 'Skip my cousin’s wedding to study for the exam', mood: 'Anxious', moodColor: '#8E7CC3', meta: 'Opened 2 Oct', verdict: 'Lesson', art: 'img/light-bulb.png', status: 'Opened' },
      { m: 'September', title: 'Hire a part-time accountant', mood: 'Rushed', moodColor: '#E5674F', meta: 'Opened 18 Sep', verdict: 'Lucky break', art: 'img/four-leaf-clover.png', status: 'Opened' },
      { m: 'September', title: 'Switch to the annual gym plan', mood: 'Calm', moodColor: '#2F9C95', meta: 'Opens 3 Nov', verdict: '', art: 'img/envelope.png', status: 'Sealed' },
      { m: 'September', title: 'Let Riya join the robotics club', mood: 'Excited', moodColor: '#D9578C', meta: 'Opens 14 Nov', verdict: '', art: 'img/envelope.png', status: 'Sealed' },
      { m: 'July', title: 'Refinance the home loan', mood: 'Tired', moodColor: '#7A8699', meta: 'Opens 2 Jan', verdict: '', art: 'img/envelope.png', status: 'Sealed' }
    ];
    var labels = ['All', 'Sealed', 'Opened'];
    var want = labels[this.state.tab];
    var list = all.filter(function (r) { return want === 'All' || r.status === want; });
    var last = '';
    return {
      tabs: labels.map(function (l, i) {
        var on = i === self.state.tab;
        var n = all.filter(function (r) { return l === 'All' || r.status === l; }).length;
        return { label: l, count: n, pressed: on ? 'true' : 'false', bg: on ? '#1D1A33' : 'transparent', ink: on ? '#FFFFFF' : '#1D1A33', countBg: on ? 'rgba(255,255,255,0.18)' : '#EEEAF7', pick: function () { self.setState({ tab: i }); } };
      }),
      rows: list.map(function (r) {
        var header = r.m !== last; last = r.m;
        var opened = !!r.verdict;
        return {
          header: header, month: r.m, title: r.title, mood: r.mood, moodColor: r.moodColor, meta: r.meta, art: r.art,
          tile: opened ? '#FDF0F5' : '#EDE7FD',
          pill: opened ? r.verdict : 'Sealed', pillBg: opened ? '#FDF0F5' : '#EEEAF7', pillInk: opened ? '#C23C72' : '#4A3A8C'
        };
      })
    };
  }
}
</script>
</body>
</html>
