<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your data v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,450,0,0&amp;icon_names=add,arrow_back,arrow_forward,call,check,chevron_right,close,edit,error,fingerprint,lock,notifications_off,search,tune,visibility&amp;display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500;1,9..144,600&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D1A33}a:hover{color:#5E587A}
.msr{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 450,'GRAD' 0,'opsz' 24;flex:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F5F2FB; font-family: 'Noto Sans', sans-serif; color: #1D1A33;">

  <div style="display: flex; align-items: center; padding: 8px 8px 0 4px; height: 56px;">
    <a href="V2Settings.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #1D1A33;"><span class="msr" aria-hidden="true" style="font-size: 24px;">arrow_back</span></a>
  </div>
  <div style="padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 4px;">
    <h1 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 800; font-size: 36px; line-height: 1.02;">Your <span style="font-style: italic; font-weight: 500; color: #5A3DD0;">data</span></h1>
    <span style="font-size: 14px; color: #5E587A;">Everything lives on this phone. Keep a copy safe.</span>
  </div>

  <div style="padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px; flex: 1;">
    <section style="border-radius: 28px; background: #FFFFFF; box-shadow: 0 14px 26px -18px rgba(29,26,51,0.45); overflow: hidden;">
      <div style="position: relative; height: 118px; background: #EDE7FD; display: flex; align-items: center; padding: 0 20px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #4A3A8C;">{{kicker}}</span>
          <span style="font-family: 'Fraunces', serif; font-weight: 800; font-size: 30px; line-height: 1.05;">{{big}}</span>
        </div>
        <img src="../img/file-cabinet.png" alt="" aria-hidden="true" width="104" height="104" style="position: absolute; right: 14px; top: 8px; width: 104px; height: 104px; transform: rotate(6deg); filter: drop-shadow(0 12px 14px rgba(78,52,190,0.25));">
      </div>
      <div style="padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px;">
        <span style="font-size: 14px; line-height: 1.45; color: #5E587A;">{{status}}</span>
        <sc-if value="{{busy}}" hint-placeholder-val="{{ false }}">
          <div role="progressbar" aria-label="Backing up" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" style="height: 10px; border-radius: 5px; background: #EEEAF7; overflow: hidden;"><div style="width: 64%; height: 100%; border-radius: 5px; background: #6E4FE6;"></div></div>
        </sc-if>
        <button onClick="{{backup}}" style="height: 56px; border: 0; border-radius: 28px; background: {{ctaBg}}; color: {{ctaInk}}; box-shadow: {{ctaShadow}}; font-family: 'Noto Sans', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer;">{{cta}}</button>
      </div>
    </section>

    <ul style="list-style: none; margin: 0; padding: 0 14px; border-radius: 22px; background: #FFFFFF; box-shadow: 0 10px 20px -16px rgba(29,26,51,0.45);">
      <li><button style="width: 100%; min-height: 64px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; gap: 12px; font-family: 'Noto Sans', sans-serif; color: #1D1A33; text-align: left;"><span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #E8F1FD; display: flex; align-items: center; justify-content: center;"><img src="../img/inbox-tray.png" alt="" width="28" height="28" style="width: 28px; height: 28px;"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">Restore from a backup</span><span style="font-size: 12px; color: #5E587A;">Needs the backup password</span></span></button></li>
      <li style="border-top: 1px solid #EEEAF7;"><button style="width: 100%; min-height: 64px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; gap: 12px; font-family: 'Noto Sans', sans-serif; color: #1D1A33; text-align: left;"><span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #EDE7FD; display: flex; align-items: center; justify-content: center;"><img src="../img/outbox-tray.png" alt="" width="28" height="28" style="width: 28px; height: 28px;"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">Export as JSON</span><span style="font-size: 12px; color: #5E587A;">For moving to another app</span></span></button></li>
      <li style="border-top: 1px solid #EEEAF7;"><button style="width: 100%; min-height: 64px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; gap: 12px; font-family: 'Noto Sans', sans-serif; color: #1D1A33; text-align: left;"><span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #E3F5EF; display: flex; align-items: center; justify-content: center;"><img src="../img/bookmark-tabs.png" alt="" width="28" height="28" style="width: 28px; height: 28px;"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 600;">Export as CSV</span><span style="font-size: 12px; color: #5E587A;">Opens in any spreadsheet</span></span></button></li>
    </ul>

    <div style="flex: 1;"></div>

    <button style="min-height: 64px; border: 0; border-radius: 22px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #F0C4D2; padding: 0 14px; display: flex; align-items: center; gap: 12px; font-family: 'Noto Sans', sans-serif; text-align: left;">
      <span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #FDF0F5; display: flex; align-items: center; justify-content: center;"><img src="../img/wastebasket.png" alt="" width="28" height="28" style="width: 28px; height: 28px;"></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 700; color: #C0392B;">Delete everything</span><span style="font-size: 12px; color: #5E587A;">Needs your PIN and typing DELETE. Can't be undone.</span></span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { busy: false }; }
  renderVals() {
    var self = this, b = this.state.busy;
    return {
      busy: b,
      kicker: b ? 'Backing up' : 'Last backup',
      big: b ? '64%' : '12 days ago',
      status: b ? 'Saving 23 letters to Downloads. You can keep using the app.' : 'Saved to Downloads. 2 letters were written after it.',
      cta: b ? 'Cancel' : 'Back up now',
      ctaBg: b ? '#FFFFFF' : '#6E4FE6', ctaInk: b ? '#1D1A33' : '#FFFFFF',
      ctaShadow: b ? 'inset 0 0 0 1.5px #1D1A33' : '0 12px 22px -10px rgba(78,52,190,0.6)',
      backup: function () { self.setState({ busy: !b }); }
    };
  }
}
</script>
</body>
</html>
